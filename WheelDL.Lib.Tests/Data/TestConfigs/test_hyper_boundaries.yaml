# Test hyperparameters with boundary values
epochs: 1              # Minimum epochs
patience: 10
batch_size: 1          # Minimum batch size
image_size: 32         # Small image size
device: 0
workers: 4
optimizer: SGD
seed: 42
deterministic: true
cos_lr: false
close_mosaic: 5
amp: true
cache: ram

lr0: 0.0001            # Very small learning rate
lrf: 0.1
momentum: 0.0          # Minimum momentum
weight_decay: 0.0      # No weight decay
warmup_epochs: 2.0
warmup_momentum: 0.8
warmup_bias_lr: 0.05

box: 5.0
cls: 0.3
dfl: 1.0

hsv_h: 0.01
hsv_s: 0.5
hsv_v: 0.3
degrees: 0.0
translate: 0.2
scale: 0.9
shear: 2.0
perspective: 0.0001
flipud: 0.1
fliplr: 0.5
mosaic: 0.8
mixup: 0.1
cutmix: 0.0

iou: 0.6
max_det: 100
dropout: 0.2
