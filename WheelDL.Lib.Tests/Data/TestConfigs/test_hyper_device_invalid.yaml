# Hyperparameters with invalid device value
task: detect
mode: train

epochs: 50
patience: 10
batch: 8
imgsz: 320
device: "invalid_device_string"  # Invalid value
workers: 4
seed: 42
deterministic: true
optimizer: SGD
close_mosaic: 5
amp: true
cache: ram
cos_lr: false

lr0: 0.01
lrf: 0.1
momentum: 0.9
weight_decay: 0.0001
warmup_epochs: 2.0
warmup_momentum: 0.8
warmup_bias_lr: 0.05

box: 5.0
cls: 0.3
dfl: 1.0

hsv_h: 0.01
hsv_s: 0.5
hsv_v: 0.3
degrees: 0.0
translate: 0.2
scale: 0.9
shear: 2.0
perspective: 0.0001
flipud: 0.1
fliplr: 0.5
mosaic: 0.8
mixup: 0.1
cutmix: 0.0

iou: 0.6
max_det: 100
dropout: 0.2
