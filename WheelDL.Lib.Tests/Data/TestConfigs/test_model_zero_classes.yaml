# Test model configuration with zero classes
task: detect
num_classes: 0  # Invalid: zero classes
default_act: ReLU

scale:
  width_multiple: 0.5
  depth_multiple: 0.33
  max_channels: 512

# Backbone
backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]

# Head
head:
  - [[15, 18, 21], 1, Detect, [num_classes]]
