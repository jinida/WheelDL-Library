# Test Hyperparameter Configuration for PHASE1 Integration Tests

# Training parameters
batch_size: 64
epochs: 200
workers: 8

# Optimizer
lr: 0.001
lr0: 0.001
momentum: 0.937
weight_decay: 0.0005
optimizer: Adam

# Learning rate scheduler
scheduler: CosineAnnealing
lrf: 0.01  # final lr = lr * lrf

# Warmup
warmup_epochs: 3
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Device
device: cuda:0

# Mixed precision training
amp: true

# Image size
imgsz: 224

# Data augmentation
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.0

# Validation
val: true
save: true
save_period: -1
