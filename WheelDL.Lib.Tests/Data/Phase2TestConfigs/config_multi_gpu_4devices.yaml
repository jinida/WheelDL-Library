# Phase2 Test Configuration: Multi-GPU 4 Devices
# Purpose: Test distributed training with 4 GPUs
# GPUs: 4 devices (cuda:0-3)
# Use case: Advanced multi-GPU training, scaling, and performance testing

# Dataset Configuration
name: mnist_segmentation_4gpu
task: segmentation
image_path: C:\Users\PC\source\repos\WheelLib\WheelDL.Lib.Tests\Data\mnist\images\
label_path: C:\Users\PC\source\repos\WheelLib\WheelDL.Lib.Tests\Data\mnist\labels\segmentation\

# Class names
names:
  0: zero
  1: one
  2: two
  3: three
  4: four
  5: five
  6: six
  7: seven
  8: eight
  9: nine

# Training Parameters
epochs: 120
patience: 25
batch_size: 32  # Per-device batch size (128 total across 4 GPUs)
image_size: 640
workers: 8  # Workers per device (32 total)
seed: 42
deterministic: true

# Multi-GPU Device Configuration
device: [0, 1, 2, 3]  # 4 GPUs
world_size: 4
dist_url: auto
dist_backend: nccl  # NVIDIA Collective Communications Library
find_unused_parameters: false

# Distributed Training Settings
sync_bn: true  # Synchronized batch normalization
broadcast_buffers: true
gradient_as_bucket_view: true
bucket_cap_mb: 25  # Gradient bucketing for efficiency

# DDP Advanced Settings
ddp_timeout: 1800  # 30 minutes timeout
static_graph: false  # Dynamic graph for flexibility

# Cache Configuration
cache: ram
cache_size: 512  # Per-device cache (2GB total)

# Optimizer Configuration
optimizer: AdamW
lr0: 0.004  # Scaled for 4 GPUs (linear scaling)
lrf: 0.001
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 5.0  # Longer warmup for large-scale training
warmup_momentum: 0.8
warmup_bias_lr: 0.2

# Learning Rate Scheduler
cos_lr: true
close_mosaic: 15

# Mixed Precision Training
amp: true

# Segmentation Parameters
overlap_mask: true
mask_ratio: 4
box: 7.5
cls: 0.5
dfl: 1.5
nbs: 128  # Nominal batch size (32 * 4 GPUs)

# Validation Settings
iou: 0.7
max_det: 300

# Data Augmentation (Heavy)
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 5.0
translate: 0.1
scale: 0.5
shear: 2.0
perspective: 0.0001
flipud: 0.0
fliplr: 0.5
bgr: 0.0
mosaic: 0.8
mixup: 0.2
cutmix: 0.1
copy_paste: 0.3
copy_paste_mode: mixup

# Validation
val: true
save: true
save_period: 10

# Multi-GPU Test Settings
test_distributed: true
test_synchronization: true
verify_gradient_sync: true
test_device_memory_balance: true
test_scaling_efficiency: true  # Test scaling from 1->2->4 GPUs
test_communication_overhead: true
rank: -1  # Auto-assign rank
local_rank: -1  # Auto-assign local rank

# Performance Monitoring
profile_gpu_memory: true
profile_communication: true
log_device_stats: true
monitor_gpu_utilization: true

# Data Loading Optimization
persistent_workers: true  # Keep workers alive
pin_memory: true  # Pin memory for faster GPU transfer
prefetch_factor: 4  # Prefetch multiple batches per worker
multiprocessing_context: spawn  # Spawn for compatibility
