# Configuration for Anomaly Detection
task_type: anomaly
image_size: 256
batch_size: 64
num_workers: 8
seed: 42

# Cache Configuration
cache_type: ram
cache_size: 2000

# Training Augmentation
degrees: 5.0
translate: 0.05
scale: 0.3
shear: 0.5
perspective: 0.0
flipud: 0.5
fliplr: 0.5
hsv_h: 0.01
hsv_s: 0.5
hsv_v: 0.3
mosaic: 0.0
blur_probability: 0.3
blur_kernel_size: 3
fill_border: 114

# Class Configuration
num_classes: 2
class_names:
  - "normal"
  - "anomaly"
