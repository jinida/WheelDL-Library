# Phase2 Test Configuration: Reproducible Augmentation
# Purpose: Test augmentation reproducibility with fixed seed
# Augmentation: Moderate augmentation with strict reproducibility
# Use case: Debugging and reproducibility testing

# Dataset Configuration
name: mnist_segmentation_reproducible
task: segmentation
image_path: C:\Users\PC\source\repos\WheelLib\WheelDL.Lib.Tests\Data\mnist\images\
label_path: C:\Users\PC\source\repos\WheelLib\WheelDL.Lib.Tests\Data\mnist\labels\segmentation\

# Class names
names:
  0: zero
  1: one
  2: two
  3: three
  4: four
  5: five
  6: six
  7: seven
  8: eight
  9: nine

# Training Parameters
epochs: 60
patience: 15
batch_size: 16
image_size: 640
workers: 1  # Single worker for strict reproducibility
seed: 12345  # Fixed seed for reproducibility
deterministic: true  # Strict deterministic mode

# Device Configuration
device: 0

# Cache Configuration
cache: ram
cache_size: 512

# Optimizer Configuration
optimizer: SGD  # SGD for reproducibility
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Learning Rate Scheduler
cos_lr: true
close_mosaic: 10

# Mixed Precision Training
amp: false  # Disable AMP for strict reproducibility

# Segmentation Parameters
overlap_mask: true
mask_ratio: 4
box: 7.5
cls: 0.5
dfl: 1.5
nbs: 64

# Validation Settings
iou: 0.7
max_det: 300

# REPRODUCIBLE DATA AUGMENTATION - MODERATE WITH FIXED SEED
# Color Augmentation
hsv_h: 0.015
hsv_s: 0.6
hsv_v: 0.3

# Geometric Augmentation
degrees: 10.0
translate: 0.1
scale: 0.4
shear: 5.0
perspective: 0.0001

# Flip Augmentation
flipud: 0.0
fliplr: 0.5

# Channel Augmentation
bgr: 0.0

# Mosaic and Mix Augmentation
mosaic: 0.7
mixup: 0.1
cutmix: 0.0

# Copy-Paste Augmentation
copy_paste: 0.2
copy_paste_mode: flip

# Blur and Noise
blur: 0.1
median_blur: 0.0
noise: 0.1

# Auto Augmentation
auto_augment: none  # Disable for reproducibility
erasing: 0.2

# Advanced Augmentation
elastic_transform: 0.0
grid_distortion: 0.0
optical_distortion: 0.0

# Validation
val: true
save: true
save_period: 10

# Reproducibility-specific settings
reproducibility_test: true
random_seed_fixed: true
torch_deterministic: true
cudnn_deterministic: true
cudnn_benchmark: false
save_random_state: true  # Save random state for verification
verify_reproducibility: true  # Verify outputs match across runs
