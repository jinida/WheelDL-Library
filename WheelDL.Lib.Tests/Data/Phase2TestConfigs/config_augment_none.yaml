# Phase2 Test Configuration: No Augmentation
# Purpose: Test baseline performance without any augmentation
# Augmentation: All augmentation disabled
# Use case: Baseline testing and pure data loading performance

# Dataset Configuration
name: mnist_detection_no_augment
task: detection
image_path: C:\Users\PC\source\repos\WheelLib\WheelDL.Lib.Tests\Data\mnist\images\
label_path: C:\Users\PC\source\repos\WheelLib\WheelDL.Lib.Tests\Data\mnist\labels\objectdetection\

# Class names
names:
  0: zero
  1: one
  2: two
  3: three
  4: four
  5: five
  6: six
  7: seven
  8: eight
  9: nine

# Training Parameters
epochs: 50
patience: 15
batch_size: 32
image_size: 640
workers: 4
seed: 42
deterministic: true  # Strict determinism

# Device Configuration
device: 0

# Cache Configuration
cache: ram
cache_size: 512

# Optimizer Configuration
optimizer: Adam
lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 2.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Learning Rate Scheduler
cos_lr: false
close_mosaic: 0

# Mixed Precision Training
amp: true

# Detection Parameters
box: 7.5
cls: 0.5
dfl: 1.5
nbs: 64

# Validation Settings
iou: 0.7
max_det: 300

# NO DATA AUGMENTATION - ALL DISABLED
# Color Augmentation (disabled)
hsv_h: 0.0
hsv_s: 0.0
hsv_v: 0.0

# Geometric Augmentation (disabled)
degrees: 0.0
translate: 0.0
scale: 0.0
shear: 0.0
perspective: 0.0

# Flip Augmentation (disabled)
flipud: 0.0
fliplr: 0.0

# Channel Augmentation (disabled)
bgr: 0.0

# Mosaic and Mix Augmentation (disabled)
mosaic: 0.0
mixup: 0.0
cutmix: 0.0

# Copy-Paste Augmentation (disabled)
copy_paste: 0.0

# Blur and Noise (disabled)
blur: 0.0
median_blur: 0.0
noise: 0.0

# Auto Augmentation (disabled)
auto_augment: none
erasing: 0.0

# Advanced Augmentation (disabled)
elastic_transform: 0.0
grid_distortion: 0.0
optical_distortion: 0.0

# Validation
val: true
save: false

# Test-specific settings
augment_test: false  # No augmentation testing needed
baseline_mode: true  # Pure baseline mode
