# Phase2 Test Configuration: Large RAM Cache (1GB)
# Purpose: Test cache behavior with abundant memory
# Cache: 1GB RAM cache (full dataset caching)
# Use case: Maximum performance testing with full dataset in memory

# Dataset Configuration
name: mnist_detection_large_cache
task: detection
image_path: C:\Users\PC\source\repos\WheelLib\WheelDL.Lib.Tests\Data\mnist\images\
label_path: C:\Users\PC\source\repos\WheelLib\WheelDL.Lib.Tests\Data\mnist\labels\objectdetection\

# Class names
names:
  0: zero
  1: one
  2: two
  3: three
  4: four
  5: five
  6: six
  7: seven
  8: eight
  9: nine

# Training Parameters
epochs: 100
patience: 20
batch_size: 64
image_size: 640
workers: 8  # Many workers with large cache
seed: 200
deterministic: true

# Device Configuration
device: 0

# Cache Configuration - LARGE
cache: ram
cache_size: 1024  # 1GB RAM cache (large)
cache_compression: true  # Enable compression for efficiency
cache_verify: true  # Verify cache integrity
cache_threads: 4  # Parallel cache loading

# Optimizer Configuration
optimizer: AdamW
lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Learning Rate Scheduler
cos_lr: true
close_mosaic: 10

# Mixed Precision Training
amp: true

# Detection Parameters
box: 7.5
cls: 0.5
dfl: 1.5
nbs: 64

# Validation Settings
iou: 0.7
max_det: 300

# Data Augmentation (Heavy - cache enables fast augmentation)
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0001
flipud: 0.0
fliplr: 0.5
bgr: 0.0
mosaic: 1.0
mixup: 0.2
cutmix: 0.1

# Validation
val: true
save: true
save_period: 10
